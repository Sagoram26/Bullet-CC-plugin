name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf8'))"

      - name: Check syntax
        run: |
          node --check hooks/bullet-hook.js
          node --check hooks/bullet-stats.js
          node --check hooks/bullet-hook.selftest.js

      - name: Selftest
        run: node hooks/bullet-hook.selftest.js
